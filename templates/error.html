<!DOCTYPE html>
<html lang="{{ lang }}"{% if theme_attr %} data-theme="{{ theme_attr }}"{% endif %} data-theme-source="{{ theme_source }}"{% if theme_default %} data-theme-default="{{ theme_default }}"{% endif %}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{{ status }} &mdash; EngineMD</title>
  <link rel="stylesheet" href="/__enginemd/css/base.css">
  <link rel="stylesheet" href="/__enginemd/css/{{ css_theme }}">
  <script>
    (function() {
      var root = document.documentElement;
      try {
        var saved = localStorage.getItem('enginemd-theme');
        if (saved === 'light' || saved === 'dark') { root.setAttribute('data-theme', saved); return; }
      } catch (e) {}
      var source = root.getAttribute('data-theme-source');
      var def = root.getAttribute('data-theme-default');
      if (source === 'auto' && def) {
        var h = location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h === '::1' || h === '[::1]') {
          root.setAttribute('data-theme', def);
        }
      }
    })();
  </script>
</head>
<body>
  <main class="error-page">
    <h1>{{ status }}</h1>
    <p>{{ message }}</p>
    <a href="/" class="home-link">&larr; Back to sites</a>
  </main>
</body>
</html>
