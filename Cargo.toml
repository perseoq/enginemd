[package]
name = "enginemd"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "query", "http1"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
comrak = { version = "0.34", default-features = false, features = ["syntect"] }
tera = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes"] }
reqwest = { version = "0.12", features = ["stream"] }
notify = "8"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
regex = "1"
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
